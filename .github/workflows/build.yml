name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain 2>&1 | tee build.log

      - name: Ringkasan error
        if: failure()
        run: |
          {
            echo '## Ringkasan error'
            echo '```'
            grep -n -A15 'What went wrong' build.log | head -60 || true
            echo '---'
            grep -nE '^e: |error:|AAPT|Error:' build.log | head -20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload log (jika gagal)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mapple-debug-apk
          path: app/build/outputs/apk/debug/*.apk
